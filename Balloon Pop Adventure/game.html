    <title>Balloon Pop Adventure | Fun Balloon Popping Game for Kids</title>
    <meta
      name="description"
      content="Play Balloon Pop Adventure, a colorful balloon popping game for kids. Pop balloons, score points, and enjoy a fun arcade adventure."
    />

    <meta
      name="keywords"
      content="Balloon Pop Adventure, balloon game, kids game, HTML5 game, browser game, arcade game, balloon popping game"
    />

    <meta name="author" content="Foxzoid Studio" />

    <meta name="robots" content="index, follow" />
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>

      <main class="game-main">
        <section class="energy-wrapper" aria-label="Energy Bar">
          <div class="energy-bar">
            <div class="energy-fill"></div>
          </div>
        </section>
        <section class="game-board">
          <div class="score-box">🏆 Points: <span class="score">0</span></div>
          <div id="balloon-container"></div>
          <div class="danger-line"></div>

          <section class="game-over hidden">
            <h2>Game Over</h2>

            <p>
              Score:
              <span class="final-score">0</span>
            </p>

            <button id="restart-btn">Play Again</button>
          </section>
        </section>
        <section class="game-controls">
          <button id="start-btn">Start Game</button>
        </section>
      </main>
    </div>
    

    <script src="js/config.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/balloon.js" defer></script>
<script src="js/game.js" defer></script>

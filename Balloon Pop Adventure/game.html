<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balloon Game UI – Full Screen</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <div class="game-ui">

      <div class="top-bar">
        <div class="pause-btn" title="Pause">
          <div class="pause-icon">
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="energy-wrap">
          <svg class="heart-icon" viewBox="0 0 24 24" fill="#FF1744">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>

          <div class="energy-bar">
            <div class="energy-fill-wrap">
              <div class="energy-fill"></div>
              <div class="energy-text">100 / 100</div>
            </div>

            <div class="plus-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff"
                stroke-width="3.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </div>
          </div>
        </div>

        <!-- ===== SCORE BOX ===== -->
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value">0</div>
          <div class="best-score">Best : 0</div>
        </div>

        <div class="coins">
          <svg class="coin-icon" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" fill="#FFD600" stroke="#F9A825"
              stroke-width="2" />
            <circle cx="16" cy="16" r="10" fill="#FFEA00" stroke="#FBC02D"
              stroke-width="1.5" />
            <text x="16" y="21" text-anchor="middle" font-size="14"
              font-weight="900" fill="#F57F17">$</text>
          </svg>
          <span class="coin-value">0</span>
        </div>
      </div>

      <div class="danger-line">
        <div class="danger-label">DANGER LINE</div>
      </div>

      <div id="balloon-container" class="balloon-container"></div>

      <section class="game-over hidden">
        <h2>Game Over</h2>

        <p>
          Score:
          <span class="final-score">0</span>
        </p>

        <div class="game-over-buttons">
          <button id="restart-btn">Play Again</button>
          <button id="home-btn">🏠 Return Home</button>
        </div>
      </section>

    </div>

    <audio id="pop-sound" preload="auto">
      <source src="assets/audio/sound-effects/pop.mp3" type="audio/mpeg" />
    </audio>
    <audio id="game-over-sound" preload="auto">
      <source src="assets/audio/sound-effects/game-over.mp3"
        type="audio/mpeg" />
    </audio>
    <audio id="click-sound" preload="auto">
      <source src="assets/audio/sound-effects/click.mp3" type="audio/mpeg" />
    </audio>
    <!-- Optional background music for the game -->
    <audio id="bg-music" loop preload="auto">
      <source src="assets/audio/home-music.mp3" type="audio/mpeg" />
    </audio>

    <script src="js/config.js" defer></script>
    <script src="js/sound.js" defer></script> <!-- ← THIS WAS MISSING -->
    <script src="js/ui.js" defer></script>
    <script src="js/balloon.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/main.js" defer></script>

  </body>
</html>
